name: Architecture checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/contact.js
          node --check scripts/inquiry-hook.js
          node --check scripts/legacy-route.js
          node --check backend/server.js
          node --check scripts/careers.js
          node --check scripts/careers-assessment.js
          node --check scripts/careers-submit-bridge.js
      - name: Check recruitment scoring and generated pages
        run: |
          python scripts/build-careers-pages.py --check
          python -m unittest careers_backend.test_app -v
          node scripts/check-careers-sheets-scoring.cjs
          node scripts/check-careers-apps-script.cjs
      - name: Validate architecture contracts
        run: node scripts/validate-architecture.mjs
      - name: Validate SEO and structured data
        run: |
          node scripts/build-home-static-content.mjs --check
          node scripts/build-static-translations.mjs --check
          node scripts/build-static-product-pages.mjs --check
          python scripts/apply-google-tag-manager.py --check
          python scripts/validate-seo.py
          node scripts/validate-structured-data.mjs
