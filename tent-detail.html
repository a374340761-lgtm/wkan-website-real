<!DOCTYPE html>
<html>
<head>
  <title>Tent details — redirect | WaiKwan</title>
  <meta name="description" content="Redirects to product detail or tent category. Bookmark product-detail.html?sku= for products.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://www.waikwantent.com/product-center.html?cat=tents">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#a4161a">
  <link rel="stylesheet" href="styles/main.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="scripts/seo.js" defer></script>
  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var id = (url.searchParams.get('sku') || url.searchParams.get('id') || '').trim();
        if (id) {
          window.location.replace('product-detail.html?sku=' + encodeURIComponent(id));
          return;
        }
        window.location.replace('product-center.html?cat=tents');
      } catch (e) {
        // ignore
      }
    })();
  </script>
</head>
<body>

<main id="detail"></main>

<div class="back-actions">
  <a href="product-center.html?cat=tents" class="btn">← Back to Tents</a>
  <a href="index.html" class="btn secondary">🏠 Home</a>
</div>

<script>

const id = new URLSearchParams(location.search).get("id");
const t = data[id];

if (t) {
  document.getElementById("detail").innerHTML = `

    <h3>Available Sizes</h3>
    <ul>${t.sizes.map(s => `<li>${s}</li>`).join("")}</ul>

} else {
  document.getElementById("detail").innerHTML = '<p>Product not found.</p>';
}
</script>

<script src="scripts/get-quote-footer.js"></script>

</body>
</html>
