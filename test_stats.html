            text-align: center;
            background: rgba(255, 255, 255, 0.15);

            min-width: 120px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-number {
            display: block;
            font-size: 2.8rem;
            font-weight: 800;
            color: #64b5f6;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            display: block !important;
            font-size: 1rem;
            opacity: 1 !important;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1e3c72 !important;
            font-weight: 700;
            text-shadow: none;
        }
